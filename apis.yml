name: Invisible Universe
description: 'Invisible Universe is a consumer entertainment company building AI-powered
  animated intellectual property for social platforms — described by FastCompany as
  "building the Pixar of the internet one TikTok at a time." It has launched multiple
  animated franchises reaching millions of followers and billions of views across
  TikTok, Instagram, and YouTube, and created Invisible Studio, a proprietary AI engine
  that compresses short-form animated content production from weeks to hours. Backed
  by Initialized Capital, it operates in the consumer/media sector. This profile was
  added to the API Evangelist network as a venture-portfolio lead; as of this pass
  the company publishes no public developer platform, API, SDK, or documentation surface.'
